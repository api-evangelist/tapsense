name: Tapsense
description: TapSense was a mobile advertising and real-time-bidding exchange founded
  in 2011 in San Francisco, connecting app publishers to brand advertisers through a
  private mobile RTB marketplace, an advertiser API and publisher SDKs. It was surfaced
  as a portfolio company of a16z and added to the API Evangelist network as a stub for
  enrichment. The company is defunct and the 2026-08-12 re-verification confirms it - the
  tapsense.com zone is now a parked domain held by Trellian Pty. Limited, serving a
  995-byte "This domain may be for sale" holding page from a wildcard A record, so www,
  api and developer subdomains all return that same page and docs.tapsense.com fails TLS
  on an expired certificate. No OpenAPI, GraphQL, AsyncAPI, MCP, agent card, webhook or
  well-known document exists on any host, and no first-party package survives on npm,
  PyPI, RubyGems, Maven Central, CocoaPods or crates.io. The advertiser API and mobile
  SDKs the company once marketed went offline with it, so there is nothing to enrich
  beyond this identity record.
